name: Docs

on:
  pull_request:
  push:
    branches:
      - '*.x'

permissions:
  contents: read

jobs:
  markdown:
    name: Markdown structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v25
        with:
          globs: '**/*.md'

  links:
    name: Internal links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check internal links and anchors
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-fragments=anchor-only --no-progress '**/*.md' .github/CONTRIBUTING.md
